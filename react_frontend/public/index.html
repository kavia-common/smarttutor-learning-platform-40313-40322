<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%232563EB%22/><text x=%2250%25%22 y=%2257%25%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22 font-family=%22Arial%2C%20sans-serif%22>S</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartTutor</title>
    <meta name="theme-color" content="#2563EB" />
    <style>
      :root{
        --color-primary:#2563EB;
        --color-secondary:#F59E0B;
        --color-bg:#f9fafb;
        --color-surface:#ffffff;
        --color-text:#111827;
      }
      html,body,#root{height:100%}
      body{
        margin:0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      }
      .container{
        width:100%;
        margin:0 auto;
        max-width:1280px;
        padding-left:1rem;
        padding-right:1rem;
      }
      .card{
        background: var(--color-surface);
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      }
      .gradient-bg{
        background-image: linear-gradient(135deg, rgba(37,99,235,0.1), #f8fafc);
      }
      .btn{
        display:inline-flex; align-items:center; justify-content:center;
        gap:.5rem; border-radius:10px; padding:.6rem 1rem; cursor:pointer; border:1px solid transparent;
        transition: all .2s ease;
      }
      .btn-primary{
        background: var(--color-primary); color:white;
      }
      .btn-primary:hover{ filter: brightness(1.05); transform: translateY(-1px); }
      .btn-ghost{
        background: transparent; color: var(--color-primary); border-color: rgba(37,99,235,.2);
      }
      .nav{
        position: sticky; top:0; z-index: 40; backdrop-filter: blur(10px);
        background: rgba(255,255,255,.75); border-bottom: 1px solid rgba(17,24,39,.06);
      }
      a { color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
