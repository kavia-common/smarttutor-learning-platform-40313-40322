version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: smarttutor_db
    environment:
      POSTGRES_DB: smarttutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarttutor"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db_data:
