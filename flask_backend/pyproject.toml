[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
  \.venv
 | build
 | dist
 | migrations/versions/.*\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "build", "dist"]
known_first_party = ["app"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist"]
